[package]
name = "evox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clean-room source port of 4x4 Evolution 1/2"

[[bin]]
name = "evox"
path = "src/main.rs"

[features]
default = []
headless = []

[dependencies]
flate2 = "1.1.11"
iso9660 = "0.1.1"
macroquad = { version = "0.4", features = ["audio"] }
md-5 = "0.11.0"
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
